services:

  mcp-service:
    build:
      context: ./services/mcp
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: mcp-service
    ports:
      - "8010:8010"
    volumes:
      - ./services/mcp:/app
      - ./services/hf_cache:/app/hf_cache
    environment:
      - GITHUB_TOKEN=${GITHUB_MCP_TOKEN}
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://mcp-service:8010/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

  agent-service:
    build:
      context: ./services/agent_service
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: agent-service
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/agent_service/src:/app/src
      - ./services/genie-kbdocs-v1/:/app/genie-kbdocs-v1
      - ./services/hf_cache:/app/hf_cache
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      mcp-service:
        condition: service_healthy
    

  data-ingestion-service:
    build:
      context: ./services/data_ingestion_service
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: data-ingestion-service
    ports:
      - "8003:8003"
    volumes:
      - ./services/data_ingestion_service/src:/app/src
      - ./services/genie-kbdocs-v1/:/app/genie-kbdocs-v1
    environment:
      - PYTHONUNBUFFERED=1


 
  frontend:
    build:
      context: ./frontend-js
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3001:80"
    volumes:
      - ./frontend-js:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - agent-service
      - data-ingestion-service
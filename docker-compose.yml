services:
  agent-service:
    build:
      context: ./services/agent_service
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: agent-service
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./services/agent_service/src:/app/src
      - ./services/genie-kbdocs-v1/:/app/genie-kbdocs-v1
      - ./services/hf_cache:/app/hf_cache
    environment:
      - PYTHONUNBUFFERED=1
    

  data-ingestion-service:
    build:
      context: ./services/data_ingestion_service
      dockerfile: Dockerfile
    env_file:
      - .env
    container_name: data-ingestion-service
    ports:
      - "8003:8003"
    volumes:
      - ./services/data_ingestion_service/src:/app/src
      - ./services/genie-kbdocs-v1/:/app/genie-kbdocs-v1
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend-js
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3001:80"
    volumes:
      - ./frontend-js:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - agent-service
      - data-ingestion-service